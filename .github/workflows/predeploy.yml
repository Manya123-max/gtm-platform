name: Pre-Deployment Validation

"on":
  push:
    branches:
      - main
      - shree-dev
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Backend Validation, Tests & Frontend Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gtm
          POSTGRES_PASSWORD: gtmpass
          POSTGRES_DB: gtm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install system dependencies (for psycopg2 / pgvector)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev gcc

      - name: Validate requirements.txt syntax & install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Python compilation and pre-deployment checks
        run: |
          python scripts/predeploy_check.py

      - name: Run backend automated tests
        env:
          APP_ENV: "test"
          DEBUG: "false"
          APP_SECRET_KEY: "ci-test-secret-key-32-chars-minimum"
          DATABASE_URL: "postgresql+asyncpg://gtm:gtmpass@localhost:5432/gtm_test"
          AUTH_ENABLED: "true"
          PYTHONPATH: "."
        run: |
          cd backend
          python -m pytest tests/test_startup_and_deployment_config.py tests/test_tiering_and_prospect_prioritization.py -v

      - name: Run frontend production build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Backend Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: validate-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image (exact Render context & Dockerfile)
        run: |
          docker build -f backend/Dockerfile -t gtm-backend:ci backend

      - name: Verify backend Docker container startup & health
        run: |
          docker run --rm \
            -e PORT=8000 \
            -e APP_ENV=production \
            -e APP_SECRET_KEY=ci-dummy-production-secret-min-32-characters \
            -e DATABASE_URL=postgresql+asyncpg://mock:mock@db:5432/mock \
            gtm-backend:ci \
            python -c "from app.main import app; print('Backend container smoke test passed!')"
