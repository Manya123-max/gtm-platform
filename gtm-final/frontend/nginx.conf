server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # ── Serve React SPA ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → FastAPI backend ──────────────────────────────────
    # FIX: increased timeouts so long-running agent calls (30-120s)
    # don't get killed, which was causing the frontend to appear frozen.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent workflow runs can take 60-120 s — never let nginx kill them
        proxy_read_timeout    180s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    180s;

        # Disable buffering for SSE / streaming endpoints
        proxy_buffering off;
    }

    # ── Webhook proxy ────────────────────────────────────────────────
    location /webhook/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # ── Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
    gzip_min_length 1024;
}
