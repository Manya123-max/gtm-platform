services:
  # ── Unified FastAPI + Celery Single-Container Web Service (Render Free) ─
  - type: web
    name: gtm-platform
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AUTH_ENABLED
        value: "true"
      - key: FRONTEND_URL
        value: https://dashing-sorbet-fd7cd5.netlify.app
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://dashing-sorbet-fd7cd5.netlify.app"
      - key: CELERY_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: gtm-platform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gtm-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: gtm-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: gtm-redis
          property: connectionString

  # ── Valkey / Redis Service (Render Free) ─────────────────────────────────
  - type: redis
    name: gtm-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru

databases:
  # ── Managed PostgreSQL ───────────────────────────────────────────────────
  - name: gtm-platform-db
    databaseName: gtm
    user: gtm
    plan: free
    region: oregon
    postgresMajorVersion: "16"
