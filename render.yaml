services:
  # ── FastAPI Backend Web Service ──────────────────────────────────────────
  - type: web
    name: gtm-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AUTH_ENABLED
        value: "true"
      - key: FRONTEND_URL
        value: https://your-frontend.netlify.app
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://your-frontend.netlify.app"
      - key: DATABASE_URL
        fromDatabase:
          name: gtm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gtm-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: gtm-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: gtm-redis
          property: connectionString

  # ── Celery Background Worker ─────────────────────────────────────────────
  - type: worker
    name: gtm-celery-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.core.celery_app worker --pool=threads -c 4 --loglevel=info -Q default,agents,webhooks
    plan: starter
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        fromService:
          type: web
          name: gtm-backend
          envVarKey: APP_SECRET_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: gtm-backend
          envVarKey: JWT_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: gtm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gtm-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: gtm-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: gtm-redis
          property: connectionString

  # ── Celery Beat Scheduler ────────────────────────────────────────────────
  - type: worker
    name: gtm-celery-beat
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.core.celery_app beat --loglevel=info
    plan: starter
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        fromService:
          type: web
          name: gtm-backend
          envVarKey: APP_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: gtm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gtm-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: gtm-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: gtm-redis
          property: connectionString

  # ── Redis Service ────────────────────────────────────────────────────────
  - type: redis
    name: gtm-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru

databases:
  # ── Managed PostgreSQL ───────────────────────────────────────────────────
  - name: gtm-db
    databaseName: gtm
    user: gtm
    plan: starter
    region: oregon
    postgresMajorVersion: "16"
